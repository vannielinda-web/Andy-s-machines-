<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobshop">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="ledger-manifest.json">
<link rel="icon" href="ledger-icon-192.png">
<link rel="apple-touch-icon" href="ledger-icon-192.png">
<title>Bobshop</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy:#1e3a5f; --bg:#f0f4f8; --card:#fff; --ink:#1a202c; --muted:#64748b; --line:#e2e8f0;
  --gain:#166534; --gainbg:#dcfce7; --loss:#991b1b; --lossbg:#fee2e2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}

.hdr{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:18px;font-weight:700}
.hdr p{font-size:11px;opacity:.65;margin-top:2px}
.hdr-btn.add{background:#fff;color:var(--navy)}
.hdr-btn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:12px;font-weight:600;padding:8px 11px;border-radius:8px}
.sync{text-align:center;padding:6px;font-size:12px;font-weight:600;background:var(--gainbg);color:var(--gain)}
.sync.saving{background:#fef9c3;color:#854d0e}
.sync.error{background:var(--lossbg);color:var(--loss)}

.sbar{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid var(--line);padding:10px 0}
.st{text-align:center;padding:0 2px}
.sn{font-size:18px;font-weight:700;color:var(--navy)}
.sn.g{color:var(--gain)} .sn.r{color:var(--loss)}
.sl{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:1px}

.sticky{position:sticky;top:0;z-index:20;background:var(--bg)}
.ftabs{display:flex;background:#fff;border-bottom:2px solid var(--line);overflow-x:auto}
.ftabs::-webkit-scrollbar{display:none}
.ft{flex-shrink:0;padding:10px 13px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.ft.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
.ft.soldtab.on{color:var(--gain);border-bottom-color:var(--gain)}
.sw{position:relative;padding:8px 12px}
.sw svg{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:15px;outline:none}
.search:focus{border-color:var(--navy)}

.list{padding:2px 12px}
.shd{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-radius:9px;margin:12px 0 6px;color:#fff;font-size:13px;font-weight:600}
.shd span{opacity:.9;font-weight:500}
.item{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:none;border-radius:11px;padding:11px 12px;margin-bottom:6px;width:100%;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.item h3{font-size:15px;font-weight:600;color:var(--ink)}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.ask{font-size:12px;color:var(--navy);font-weight:600;margin-top:2px}
.bgs{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.bg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px}
.F1{background:#dbeafe;color:#1e40af} .F2{background:#ede9fe;color:#5b21b6} .CL{background:#fee2e2;color:#991b1b}
.sd{background:var(--gainbg);color:var(--gain)}
.bg.off{background:#f1f5f9;color:#cbd5e1}
.money{text-align:right;flex-shrink:0}
.money .p{font-size:17px;font-weight:700;color:var(--navy)}
.money .s{font-size:11px;color:var(--muted)}
.gain{color:var(--gain)!important} .loss{color:var(--loss)!important}
.th{width:56px;height:56px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#e2e8f0}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#e2e8f0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
.ph .cover{position:absolute;left:3px;bottom:3px;font-size:9px;font-weight:700;background:var(--navy);color:#fff;padding:1px 5px;border-radius:9px}
.addph{aspect-ratio:1;border:2px dashed #cbd5e1;border-radius:9px;background:#f8fafc;color:var(--navy);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addph b{font-size:22px;line-height:1}
.viewer{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.vbtn{position:absolute;border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px}
.vclose{top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.vprev{left:10px;top:50%;transform:translateY(-50%)} .vnext{right:10px;top:50%;transform:translateY(-50%)}
.vcount{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px}
.empty{text-align:center;color:#94a3b8;padding:40px 20px;font-size:14px}
.totalbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;padding:13px 14px;border-radius:11px;background:var(--navy);color:#fff}
.totalbar.soldbar{background:var(--gain)}
.totalbar b{display:block;font-size:15px}
.totalbar span{display:block;font-size:12px;opacity:.85;margin-top:1px}
.tb{text-align:right;font-size:20px;font-weight:700}

.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:18px;width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;font-size:30px;border:none;box-shadow:0 4px 14px rgba(30,58,95,.4);z-index:30;line-height:1}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.mod{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
.mod h2{font-size:17px;font-weight:700;margin-bottom:6px}
.mod label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 4px}
.field{width:100%;padding:11px;font-size:16px;border:1.5px solid var(--line);border-radius:9px;background:#f8fafc;outline:none;-webkit-appearance:none}
.field:focus{border-color:var(--navy);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.po{padding:10px 4px;border:1.5px solid var(--line);border-radius:9px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);background:#f8fafc}
.po.on.F1{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
.po.on.F2{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
.po.on.CL{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.calc{margin-top:10px;background:#f8fafc;border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.calc .p{font-size:20px;font-weight:700;color:var(--navy)}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--muted)}
.btn.main{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.del{color:var(--loss);border-color:#fecaca}
.catrow{display:flex;gap:6px;align-items:center;background:#f8fafc;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.catrow input{flex:1;min-width:0;border:none;padding:6px;font-size:15px;font-weight:600;background:transparent;outline:none}
.mv{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;font-size:13px;color:var(--navy)}
.mv:disabled{opacity:.3}
.x{border:none;background:none;color:var(--loss);font-size:13px;font-weight:600;padding:6px}
.addc{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
.toast.show{opacity:1}

/* SOLD celebration */
.party{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(22,101,52,.25);overflow:hidden}
.party.show{display:flex}
.sold-card{background:#fff;border-radius:20px;padding:26px 30px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.sold-card .big{font-size:44px;font-weight:800;color:var(--gain);letter-spacing:1px}
.sold-card .pr{color:var(--ink);font-size:22px;font-weight:700;margin-top:4px}
.sold-card .nm{font-size:14px;color:var(--muted);margin-top:4px}
.coin{position:absolute;top:-40px;font-size:30px;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sold-card{animation:none}.coin{display:none}.toast{transition:none}}
</style>
</head>
<body>

<div class="hdr">
  <div><h1>💰 Bobshop</h1><p id="sync-sub">Tap a machine to edit</p></div>
  <div style="display:flex;gap:6px"><button class="hdr-btn" id="catBtn">📂 Categories</button><button class="hdr-btn add" id="addBtn" aria-label="Add machine">+ Add</button></div>
</div>
<div class="sync" id="sync">☁️ Connecting…</div>
<div class="sbar">
  <div class="st"><div class="sn g" id="tProfit">$0</div><div class="sl">Profit</div></div>
  <div class="st"><div class="sn" id="tStock">0</div><div class="sl">Unsold</div></div>
  <div class="st"><div class="sn g" id="tSold">0</div><div class="sl">Sold</div></div>
  <div class="st"><div class="sn" id="tInvested">$0</div><div class="sl">Inventory cost</div></div>
</div>

<div class="sticky">
  <div class="ftabs" id="tabs"></div>
  <div class="sw"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><input class="search" id="q" type="search" placeholder="Search brand, model, origin…" aria-label="Search"></div>
</div>

<div class="list" id="list"><div class="empty">☁️ Loading…</div></div>


<!-- Item form -->
<div class="ov" id="itemBg">
  <div class="mod">
    <h2 id="itemTitle">Add machine</h2>
    <label>Photos</label>
    <div class="photos" id="photoGrid"></div>
    <input type="file" id="photoIn" accept="image/*" multiple hidden>
    <label for="fCat">Category</label>
    <select class="field" id="fCat"></select>
    <div class="two">
      <div><label for="fBrand">Brand</label><input class="field" id="fBrand" list="brandList" autocomplete="off"></div>
      <div><label for="fModel">Model</label><input class="field" id="fModel" list="modelList" autocomplete="off"></div>
    </div>
    <datalist id="brandList"></datalist>
    <datalist id="modelList"></datalist>
    <label for="fOrigin">Origin</label>
    <input class="field" id="fOrigin" list="originList" autocomplete="off" placeholder="Facebook, auction, yard sale…">
    <datalist id="originList"></datalist>
    <label>Listed on</label>
    <div class="pg" id="plGroup">
      <button type="button" class="po F1" data-pl="F1">Facebook 1</button>
      <button type="button" class="po F2" data-pl="F2">Facebook 2</button>
      <button type="button" class="po CL" data-pl="CL">Craigslist</button>
    </div>
    <div class="two">
      <div><label for="fBuy">Purchase price ($)</label><input class="field" id="fBuy" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="fParts">Parts expenditure ($)</label><input class="field" id="fParts" type="number" inputmode="decimal" min="0" step="0.01"></div>
    </div>
    <div class="two">
      <div><label for="fAsk">Asking price ($)</label><input class="field" id="fAsk" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="fSale">Sale price ($)</label><input class="field" id="fSale" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Empty if unsold"></div>
    </div>
    <div class="two">
      <div><label for="fGot">Date acquired</label><input class="field" id="fGot" type="date"></div>
      <div><label for="fSold">Date sold</label><input class="field" id="fSold" type="date"></div>
    </div>
    <label for="fNotes">Notes</label>
    <input class="field" id="fNotes" autocomplete="off">
    <div class="calc"><span>Total expenditure</span><span class="p" id="calcCost">$0</span></div>
    <div class="calc" id="profitRow"><span>Profit</span><span class="p" id="calcVal">$0</span></div>
    <button class="btn" id="restockBtn" style="width:100%;margin-top:12px;color:var(--navy);border-color:#93c5fd;background:#eff6ff">↩ Return to stock (remove sale)</button>
    <div class="btns">
      <button class="btn del" id="delBtn">Delete</button>
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn main" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Categories -->
<div class="ov" id="catBg">
  <div class="mod">
    <h2>📂 Categories</h2>
    <div id="catEdit" style="margin-top:10px"></div>
    <div class="catrow">
      <input id="newCat" placeholder="New category name">
      <button class="addc" id="addCat">Add</button>
    </div>
    <button class="btn" id="soundBtn" style="width:100%;margin-top:10px"></button>
    <div class="btns">
      <button class="btn" id="exportBtn">Download spreadsheet</button>
      <button class="btn main" id="catDone">Done</button>
    </div>
  </div>
</div>

<div class="party" id="party"><div class="sold-card"><div class="big" id="partyTitle">SOLD!</div><div class="pr" id="partyProfit"></div><div class="nm" id="partyName"></div></div></div>
<div class="viewer" id="viewer">
  <img id="vImg" alt="Machine photo">
  <button class="vbtn vclose" id="vClose" aria-label="Close">✕</button>
  <button class="vbtn vprev" id="vPrev" aria-label="Previous">‹</button>
  <button class="vbtn vnext" id="vNext" aria-label="Next">›</button>
  <div class="vcount" id="vCount"></div>
</div>
<div class="toast" id="toast"></div>

var DEFAULT_CATS = ["Chainsaws","Trimmers","Blowers","Mowers","Generators","Pressure washers","Other"];
var COLORS = ['#1e3a5f','#1e4d2b','#4a1d6e','#991b1b','#92400e','#064e3b','#1e40af','#be185d','#0f766e','#b45309','#374151','#dc2626'];
var PL = {F1:'Facebook 1',F2:'Facebook 2',CL:'Craigslist'};

var items = [], cats = [], tab = 'all', editId = null, curPl = [], formPhotos = [], removedPhotos = [], newItemId = null;
var $ = function(id){ return document.getElementById(id); };

function money(n){
  var neg = n < 0; n = Math.abs(n);
  var s = '$' + n.toLocaleString('en-US',{minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2});
  return neg ? '-' + s : s;
}
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function isSold(i){ return i.sale !== null && i.sale !== undefined && i.sale !== ''; }
function profitOf(i){ return num(i.sale) - num(i.buy) - num(i.parts); }
function costOf(i){ return num(i.buy) + num(i.parts); }
function catName(id){ var c = cats.find(function(x){return x.id===id;}); return c ? c.name : 'No category'; }
function catColor(c,k){ return c.color || COLORS[k % COLORS.length]; }
function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmtDate(d){ if(!d) return ''; var p=d.split('-'); return p[1]+'/'+p[2]+'/'+p[0].slice(2); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(function(){el.classList.remove('show');},1800); }
function nameOf(i){ return ((i.brand||'')+' '+(i.model||'')).trim(); }

// ---------- Live sync ----------
CATS.orderBy('order').onSnapshot(function(snap){
  if(snap.empty && !snap.metadata.fromCache){
    var b = db.batch();
    DEFAULT_CATS.forEach(function(n,i){ b.set(CATS.doc(), {name:n, order:i}); });
    b.commit(); return;
  }
  cats = snap.docs.map(function(d){ var x=d.data(); return {id:d.id, name:x.name, order:x.order, color:x.color}; });
  renderTabs(); render();
}, onErr);

ITEMS.onSnapshot({includeMetadataChanges:true}, function(snap){
  items = snap.docs.map(function(d){ var x=d.data(); x.id=d.id; return x; });
  var el=$('sync');
  if(snap.metadata.hasPendingWrites){ el.textContent='⏳ Saving…'; el.className='sync saving'; }
  else if(snap.metadata.fromCache){ el.textContent='📴 Offline, will sync'; el.className='sync saving'; }
  else { el.textContent='✅ Synced'; el.className='sync'; }
  render();
}, onErr);
function onErr(e){ $('sync').textContent='⚠ Not connected'; $('sync').className='sync error'; console.error(e); }

// ---------- Render ----------
function renderTabs(){
  var h = '<button class="ft'+(tab==='all'?' on':'')+'" data-t="all">All</button>';
  cats.forEach(function(c){ h += '<button class="ft'+(tab===c.id?' on':'')+'" data-t="'+c.id+'">'+esc(c.name)+'</button>'; });
  h += '<button class="ft soldtab'+(tab==='sold'?' on':'')+'" data-t="sold">✅ Sold</button>';
  $('tabs').innerHTML = h;
  var sel = $('fCat').value;
  $('fCat').innerHTML = cats.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join('');
  if(sel) $('fCat').value = sel;
}

function card(i, showCat){
  var s = isSold(i), p = profitOf(i);
  var dates = [];
  if(i.got) dates.push('Got '+fmtDate(i.got));
  if(i.sold) dates.push('Sold '+fmtDate(i.sold));
  var meta = [showCat?catName(i.cat):'', i.origin].filter(Boolean).map(esc).join(' · ');
  // Always show all three in the same order and spot; unused ones are greyed out.
  var on = i.pl||[];
  var badges = ['F1','F2','CL'].map(function(k){ return '<span class="bg '+(on.indexOf(k)>=0?k:'off')+'">'+PL[k]+'</span>'; }).join('');
  if(s) badges += '<span class="bg sd">Sold</span>';
  return '<button class="item" data-id="'+i.id+'">'+
    (i.thumb?'<img class="th" src="'+i.thumb+'" alt="">':'')+
    '<div style="min-width:0;flex:1"><h3>'+esc(nameOf(i))+'</h3>'+
    (meta?'<div class="meta">'+meta+'</div>':'')+
    (i.ask!=null&&!s?'<div class="ask">Asking '+money(num(i.ask))+'</div>':'')+
    (dates.length?'<div class="meta">'+dates.join(' · ')+'</div>':'')+
    (i.photos>1?'<div class="meta">📷 '+i.photos+' photos</div>':'')+
    (badges?'<div class="bgs">'+badges+'</div>':'')+'</div>'+
    '<div class="money">'+(s
      ? '<div class="p '+(p<0?'loss':'gain')+'">'+money(p)+'</div><div class="s">sold for '+money(num(i.sale))+'</div>'
      : '<div class="p">'+money(costOf(i))+'</div><div class="s">expenditure</div>')+
    '</div></button>';
}

function render(){
  var sold = items.filter(isSold), stock = items.filter(function(i){return !isSold(i);});
  var tp = sold.reduce(function(a,i){return a+profitOf(i);},0);
  $('tProfit').textContent = money(tp);
  $('tProfit').className = 'sn '+(tp<0?'r':'g');
  $('tSold').textContent = sold.length;
  $('tStock').textContent = stock.length;
  $('tInvested').textContent = money(stock.reduce(function(a,i){return a+costOf(i);},0));

  var q = $('q').value.trim().toLowerCase();
  var pool = tab==='sold' ? sold : stock;           // sold machines only live in the Sold tab
  var list = pool.filter(function(i){
    if(tab!=='all' && tab!=='sold' && i.cat!==tab) return false;
    if(q && (nameOf(i)+' '+(i.origin||'')+' '+(i.notes||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){
    if(tab==='sold') return (b.sold||'').localeCompare(a.sold||'') || (b.created||0)-(a.created||0);
    return (b.got||'').localeCompare(a.got||'') || (b.created||0)-(a.created||0);
  });

  if(!list.length){
    $('list').innerHTML = '<div class="empty">'+(tab==='sold' ? 'No sold machines yet.' : (items.length ? 'Nothing here. Try another category or search.' : 'No machines yet. Tap + Add at the top to add the first one.'))+'</div>';
    return;
  }

  var foot;
  if(tab==='sold'){
    var sales = list.reduce(function(t,i){return t+num(i.sale);},0), pr = list.reduce(function(t,i){return t+profitOf(i);},0);
    foot = '<div class="totalbar soldbar"><div><b>Sold total</b><span>'+list.length+' machine'+(list.length===1?'':'s')+' · profit '+money(pr)+'</span></div><div class="tb">'+money(sales)+'<span style="font-size:11px;font-weight:400">in sales</span></div></div>';
  } else {
    var ask = list.reduce(function(t,i){return t+num(i.ask);},0);
    foot = '<div class="totalbar"><div><b>Inventory total</b><span>'+list.length+' machine'+(list.length===1?'':'s')+'</span></div><div class="tb">'+money(ask)+'<span style="font-size:11px;font-weight:400">total asking price</span></div></div>';
  }

  if(tab!=='all' && tab!=='sold'){ $('list').innerHTML = list.map(function(i){return card(i,false);}).join('') + foot; return; }

  var html = '', known = {};
  cats.forEach(function(c,k){
    known[c.id]=1;
    var g = list.filter(function(i){return i.cat===c.id;});
    if(!g.length) return;
    var sub = tab==='sold' ? g.length+' · '+money(g.reduce(function(t,i){return t+profitOf(i);},0))+' profit'
                           : g.length+' · '+money(g.reduce(function(t,i){return t+num(i.ask);},0));
    html += '<div class="shd" style="background:'+catColor(c,k)+'">'+esc(c.name)+'<span>'+sub+'</span></div>'+g.map(function(i){return card(i,false);}).join('');
  });
  var rest = list.filter(function(i){return !known[i.cat];});
  if(rest.length) html += '<div class="shd" style="background:#374151">No category<span>'+rest.length+'</span></div>'+rest.map(function(i){return card(i,false);}).join('');
  $('list').innerHTML = html + foot;
}

// ---------- Suggestions ----------
function typeForCat(){
  var cn = catName($('fCat').value).toLowerCase().replace(/es$|s$/,'');
  var hit = null;
  Object.keys(MODELS).forEach(function(b){ Object.keys(MODELS[b]).forEach(function(t){ if(t.toLowerCase()===cn) hit=t; }); });
  return hit;
}
function refreshBrands(){
  var set = {};
  Object.keys(MODELS).forEach(function(b){ set[b]=1; });
  items.forEach(function(i){ if(i.brand) set[i.brand]=1; });
  $('brandList').innerHTML = Object.keys(set).sort().map(function(b){return '<option value="'+esc(b)+'">';}).join('');
  refreshModels();
}
function refreshModels(){
  var br = $('fBrand').value.trim().toLowerCase(), want = typeForCat(), first = [], rest = [], seen = {};
  Object.keys(MODELS).forEach(function(b){
    if(b.toLowerCase()!==br) return;
    Object.keys(MODELS[b]).forEach(function(t){
      MODELS[b][t].forEach(function(m){ if(seen[m]) return; seen[m]=1; (t===want?first:rest).push([m,t]); });
    });
  });
  items.forEach(function(i){ if(i.model && (i.brand||'').toLowerCase()===br && !seen[i.model]){ seen[i.model]=1; first.push([i.model,'Used before']); } });
  $('modelList').innerHTML = first.concat(rest).map(function(x){return '<option value="'+esc(x[0])+'" label="'+esc(x[1])+'">';}).join('');
}
function refreshOrigins(){
  var set = {"Facebook Marketplace":1,"Craigslist":1,"Auction":1,"Yard sale":1,"Trade":1};
  items.forEach(function(i){ if(i.origin) set[i.origin]=1; });
  $('originList').innerHTML = Object.keys(set).map(function(o){return '<option value="'+esc(o)+'">';}).join('');
}
function updateCalc(){
  var sale = $('fSale').value, cost = num($('fBuy').value)+num($('fParts').value);
  $('calcCost').textContent = money(cost);
  if(sale===''){ $('profitRow').style.display='none'; }
  else { var p = num(sale)-cost; $('profitRow').style.display=''; $('calcVal').textContent=money(p); $('calcVal').className='p '+(p<0?'loss':'gain'); }
}
function paintPl(){
  Array.prototype.forEach.call($('plGroup').children,function(b){
    var on = curPl.indexOf(b.dataset.pl)>=0;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
}

// ---------- Item form ----------
function openItem(id){
  editId = id || null;
  var i = id ? items.find(function(x){return x.id===id;}) : {};
  $('itemTitle').textContent = id ? 'Edit machine' : 'Add machine';
  $('delBtn').style.display = id ? '' : 'none';
  $('restockBtn').style.display = (id && isSold(i)) ? '' : 'none';
  $('fCat').value = i.cat || (tab!=='all'&&tab!=='sold' ? tab : (cats[0]&&cats[0].id));
  $('fBrand').value = i.brand||''; $('fModel').value = i.model||''; $('fOrigin').value = i.origin||'';
  $('fBuy').value = i.buy!=null?i.buy:''; $('fParts').value = i.parts!=null?i.parts:'';
  $('fSale').value = i.sale!=null?i.sale:''; $('fAsk').value = i.ask!=null?i.ask:'';
  $('fGot').value = i.got || (id?'':today());
  $('fSold').value = i.sold||''; $('fNotes').value = i.notes||'';
  curPl = (i.pl||[]).slice(); paintPl();
  formPhotos = []; removedPhotos = []; newItemId = id ? null : ITEMS.doc().id; paintPhotos();
  if(id){
    var want = id;
    PHOTOS.where('item','==',id).get().then(function(snap){
      if(editId!==want) return;
      formPhotos = snap.docs.map(function(d){ var x=d.data(); return {id:d.id, data:x.data, thumb:x.thumb, created:x.created||0}; })
        .sort(function(a,b){return a.created-b.created;}).concat(formPhotos.filter(function(p){return p.isNew;}));
      paintPhotos();
    }).catch(function(){ toast('Could not load photos'); });
  }
  refreshBrands(); refreshOrigins(); updateCalc();
  $('itemBg').classList.add('open');
}
function closeItem(){ $('itemBg').classList.remove('open'); }

$('plGroup').onclick = function(e){
  var b = e.target.closest('[data-pl]'); if(!b) return;
  var k = b.dataset.pl, at = curPl.indexOf(k);
  if(at>=0) curPl.splice(at,1); else curPl.push(k);
  paintPl();
};

$('saveBtn').onclick = function(){
  var brand = $('fBrand').value.trim(), model = $('fModel').value.trim();
  if(!brand && !model){ toast('Add a brand or model first'); return; }
  var sale = $('fSale').value;
  var prev = editId ? items.find(function(x){return x.id===editId;}) : null;
  var data = {
    cat:$('fCat').value, brand:brand, model:model, origin:$('fOrigin').value.trim(),
    pl: ['F1','F2','CL'].filter(function(k){ return curPl.indexOf(k)>=0; }),
    buy: $('fBuy').value===''?null:num($('fBuy').value),
    parts: $('fParts').value===''?null:num($('fParts').value),
    ask: $('fAsk').value===''?null:num($('fAsk').value),
    sale: sale===''?null:num(sale),
    got:$('fGot').value,
    sold: sale==='' ? '' : ($('fSold').value || today()),
    notes:$('fNotes').value.trim()
  };
  var justSold = sale!=='' && !(prev && isSold(prev));
  var prevPl = prev ? (prev.pl||[]) : [];
  var newPl = data.pl.filter(function(k){ return prevPl.indexOf(k)<0; });
  var id = editId || newItemId;
  data.thumb = formPhotos.length ? formPhotos[0].thumb : null;
  data.photos = formPhotos.length;
  if(editId){ ITEMS.doc(id).update(data); }
  else { data.created = Date.now(); ITEMS.doc(id).set(data); }
  var base = Date.now();
  formPhotos.forEach(function(ph,k){
    if(ph.isNew) PHOTOS.add({item:id, data:ph.data, thumb:ph.thumb, created:base+k});
  });
  removedPhotos.forEach(function(pid){ PHOTOS.doc(pid).delete(); });
  closeItem();
  if(justSold) celebrate(data);
  else if(!editId) addedParty(data);
  else if(newPl.length) listedParty(data, newPl);
  else toast('Saved');
};
$('delBtn').onclick = function(){
  if(editId && confirm('Delete this machine and its photos? This can’t be undone.')){
    var id = editId;
    ITEMS.doc(id).delete();
    PHOTOS.where('item','==',id).get().then(function(snap){ snap.docs.forEach(function(d){ d.ref.delete(); }); });
    toast('Deleted'); closeItem();
  }
};
$('restockBtn').onclick = function(){
  if(!editId || !confirm('Return this machine to stock? This removes the sale price and date sold.')) return;
  var it = items.find(function(x){return x.id===editId;}) || {};
  ITEMS.doc(editId).update({sale:null, sold:''});
  sadTrombone();
  closeItem();
  showParty({title:'BACK IN STOCK', color:'#64748b', tint:'rgba(71,85,105,.3)',
    line1:'😢 Sale removed', line2:nameOf(it) + ' is back in the shop',
    emojis:['😢','😭','🥺','😞'], ms:3200});
};
$('cancelBtn').onclick = closeItem;
$('itemBg').onclick = function(e){ if(e.target===this) closeItem(); };
['fBuy','fParts','fSale'].forEach(function(id){ $(id).oninput = updateCalc; });
$('fCat').onchange = refreshBrands;
$('fBrand').oninput = refreshModels;
$('addBtn').onclick = function(){ openItem(null); };


// ---------- Photos ----------
// Photos are shrunk on the phone and saved in Firebase (money_photos), one per record,
// so they sync to both phones without any extra setup.
function paintPhotos(){
  var h = formPhotos.map(function(p,k){
    return '<div class="ph"><img src="'+(p.thumb||p.data)+'" data-view="'+k+'" alt="Photo '+(k+1)+'">'+
      (k===0?'<span class="cover">Cover</span>':'')+
      '<button type="button" class="rm" data-rm="'+k+'" aria-label="Remove photo">✕</button></div>';
  }).join('');
  h += '<button type="button" class="addph" id="addPh"><b>+</b>Add photos</button>';
  $('photoGrid').innerHTML = h;
}
function loadImg(file){
  return new Promise(function(res,rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ res(im); setTimeout(function(){URL.revokeObjectURL(url);},1000); };
    im.onerror = rej; im.src = url;
  });
}
function shrink(im, max, q){
  var r = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
  var c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth*r); c.height = Math.round(im.naturalHeight*r);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', q);
}
function thumbOf(im){
  var s = 160, c = document.createElement('canvas'); c.width = c.height = s;
  var w = im.naturalWidth, h = im.naturalHeight, m = Math.min(w,h);
  c.getContext('2d').drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,s,s);
  return c.toDataURL('image/jpeg',0.6);
}
$('photoGrid').onclick = function(e){
  var t = e.target;
  if(t.closest('#addPh')){ $('photoIn').click(); return; }
  if(t.dataset.rm!=null){
    var k = +t.dataset.rm, p = formPhotos[k];
    if(p.id) removedPhotos.push(p.id);
    formPhotos.splice(k,1); paintPhotos(); return;
  }
  if(t.dataset.view!=null) openViewer(+t.dataset.view);
};
$('photoIn').onchange = function(){
  var files = Array.prototype.slice.call(this.files||[]); this.value='';
  if(!files.length) return;
  toast('Adding '+files.length+' photo'+(files.length>1?'s':'')+'…');
  files.reduce(function(chain,f){
    return chain.then(function(){
      return loadImg(f).then(function(im){
        var d = shrink(im,1280,0.72);
        if(d.length>700000) d = shrink(im,1024,0.6);
        if(d.length>700000) d = shrink(im,800,0.5);
        formPhotos.push({data:d, thumb:thumbOf(im), isNew:true}); paintPhotos();
      }).catch(function(){ toast('One photo could not be read'); });
    });
  }, Promise.resolve());
};

// full-screen viewer
var vAt = 0, vList = [];
function showV(){
  var p = vList[vAt]; if(!p) return;
  $('vImg').src = p.data || p.thumb; $('vCount').textContent = (vAt+1)+' / '+vList.length;
  $('vPrev').style.display = $('vNext').style.display = vList.length>1 ? '' : 'none';
}
function openViewer(k){ vList = formPhotos; vAt = k; showV(); $('viewer').classList.add('open'); }
// Tapping a thumbnail in the list opens just the photos (no edit form).
function openGallery(id){
  var it = items.find(function(x){return x.id===id;}); if(!it) return;
  vList = [{thumb:it.thumb}]; vAt = 0; showV(); $('vCount').textContent = 'Loading photos…';
  $('viewer').classList.add('open');
  PHOTOS.where('item','==',id).get().then(function(snap){
    if(!$('viewer').classList.contains('open')) return;
    var ph = snap.docs.map(function(d){ var x=d.data(); return {data:x.data, thumb:x.thumb, created:x.created||0}; })
      .sort(function(a,b){return a.created-b.created;});
    if(ph.length){ vList = ph; vAt = 0; showV(); }
  }).catch(function(){ $('vCount').textContent = 'Could not load photos'; });
}
$('vClose').onclick = function(){ $('viewer').classList.remove('open'); };
$('vPrev').onclick = function(){ vAt = (vAt-1+vList.length)%vList.length; showV(); };
$('vNext').onclick = function(){ vAt = (vAt+1)%vList.length; showV(); };
var tx = null;
$('viewer').addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, {passive:true});
$('viewer').addEventListener('touchend', function(e){
  if(tx===null) return; var dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx)>50){ (dx<0?$('vNext'):$('vPrev')).click(); }
});

// ---------- Cash register ----------
var actx, soundOn = true;
try { soundOn = localStorage.getItem('ledgerSound') !== 'off'; } catch(e){}
function ctx(){ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function tick(){
  if(!soundOn) return;
  try{
    var a = ctx(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(1800,t); o.frequency.exponentialRampToValueAtTime(900,t+0.03);
    g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.06);
  }catch(e){}
}
document.addEventListener('pointerdown', function(e){ if(e.target.closest('button, .ft, select')) tick(); });
function paintSound(){ $('soundBtn').textContent = soundOn ? '🔊 Sounds: On' : '🔇 Sounds: Off'; }
paintSound();
$('soundBtn').onclick = function(){
  soundOn = !soundOn; paintSound();
  try { localStorage.setItem('ledgerSound', soundOn?'on':'off'); } catch(e){}
};
function happyTune(){
  if(!soundOn) return;
  try{
    var a = ctx(), t = a.currentTime + 0.03;
    [[523.25,0],[659.25,0.09],[783.99,0.18],[1046.5,0.27],[1318.5,0.38]].forEach(function(n,k){
      var o = a.createOscillator(), g = a.createGain(), d = k===4 ? 0.6 : 0.22;
      o.type='triangle'; o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t+n[1]);
      g.gain.exponentialRampToValueAtTime(0.25,t+n[1]+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]+d);
      o.connect(g); g.connect(a.destination); o.start(t+n[1]); o.stop(t+n[1]+d+0.02);
    });
  }catch(e){}
}
function sadTrombone(){
  if(!soundOn) return;
  try{
    var a = ctx(), t = a.currentTime + 0.05;
    var notes = [[233.08,0,0.42],[220.00,0.45,0.42],[207.65,0.90,0.42],[196.00,1.35,1.3]]; // Bb, A, Ab, G... waaah
    var f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1100; f.Q.value=2;
    var out = a.createGain(); out.gain.value=0.22; f.connect(out); out.connect(a.destination);
    notes.forEach(function(n,k){
      var o = a.createOscillator(), g = a.createGain(), st = t+n[1], en = st+n[2];
      o.type='sawtooth'; o.frequency.setValueAtTime(n[0]*1.03, st); o.frequency.exponentialRampToValueAtTime(n[0], st+0.08);
      if(k===3){ // wobbly last note
        var lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value=5.5; lg.gain.value=6;
        lfo.connect(lg); lg.connect(o.frequency); lfo.start(st+0.25); lfo.stop(en);
        o.frequency.exponentialRampToValueAtTime(n[0]*0.94, en);
      }
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(1, st+0.04);
      g.gain.setValueAtTime(1, en-0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, en);
      o.connect(g); g.connect(f); o.start(st); o.stop(en+0.02);
    });
  }catch(e){}
}
function kaChing(){
  if(!soundOn) return;
  try{
    ctx();
    var t = actx.currentTime;
    // drawer "ka": short noise burst
    var len = actx.sampleRate*0.09, buf = actx.createBuffer(1,len,actx.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    var n = actx.createBufferSource(); n.buffer=buf;
    var nf = actx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=2500;
    var ng = actx.createGain(); ng.gain.value=0.6;
    n.connect(nf); nf.connect(ng); ng.connect(actx.destination); n.start(t);
    // bell "ching"
    function bell(f,start,dur,vol){
      [1,2.76,5.4].forEach(function(h,k){
        var o=actx.createOscillator(), g=actx.createGain();
        o.type='sine'; o.frequency.value=f*h;
        g.gain.setValueAtTime(0.0001,t+start);
        g.gain.exponentialRampToValueAtTime(vol/(k+1),t+start+0.005);
        g.gain.exponentialRampToValueAtTime(0.0001,t+start+dur);
        o.connect(g); g.connect(actx.destination); o.start(t+start); o.stop(t+start+dur+0.05);
      });
    }
    bell(1568,0.10,1.2,0.35); bell(2093,0.17,1.4,0.3);
    // coins
    for(var c=0;c<7;c++) bell(3000+Math.random()*1800, 0.35+c*0.06+Math.random()*0.03, 0.18, 0.08);
  }catch(e){}
}
function showParty(o){
  var party = $('party');
  $('partyTitle').textContent = o.title; $('partyTitle').style.color = o.color;
  party.style.background = o.tint;
  $('partyProfit').textContent = o.line1; $('partyProfit').className = 'pr '+(o.cls||'');
  $('partyName').textContent = o.line2;
  party.querySelectorAll('.coin').forEach(function(c){c.remove();});
  for(var k=0;k<22;k++){
    var c=document.createElement('div'); c.className='coin';
    c.textContent = o.emojis[k%o.emojis.length];
    c.style.left = Math.random()*100+'vw';
    c.style.animationDuration = (1.4+Math.random()*1.4)+'s';
    c.style.animationDelay = (Math.random()*0.6)+'s';
    party.appendChild(c);
  }
  party.classList.add('show');
  clearTimeout(showParty.t);
  showParty.t = setTimeout(function(){ party.classList.remove('show'); }, o.ms || 2800);
}
function celebrate(it){
  kaChing();
  if(navigator.vibrate) navigator.vibrate([60,40,120]);
  var p = num(it.sale) - num(it.buy) - num(it.parts);
  showParty({title:'SOLD!', color:'#166534', tint:'rgba(22,101,52,.25)',
    line1:(p>=0?'+':'') + money(p) + ' profit', cls:(p<0?'loss':'gain'),
    line2:nameOf(it) + ' sold for ' + money(num(it.sale)), emojis:['💵','🪙','💰']});
}
function plNames(list){ return list.map(function(k){return PL[k];}).join(', ').replace(/, ([^,]*)$/,' and $1'); }
function addedParty(it){
  happyTune();
  if(navigator.vibrate) navigator.vibrate(60);
  showParty({title:'ADDED!', color:'#1e3a5f', tint:'rgba(30,58,95,.25)',
    line1:'🐷 New machine in the shop', line2:nameOf(it) + ((it.pl||[]).length ? ' · listed on '+plNames(it.pl) : ''),
    emojis:['🔧','⚙️','🛠️','🐷']});
}
function listedChime(){
  if(!soundOn) return;
  try{
    var a = ctx(), t = a.currentTime + 0.03;
    [[880,0],[1318.5,0.12],[1760,0.24]].forEach(function(n){
      var o = a.createOscillator(), g = a.createGain();
      o.type='sine'; o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t+n[1]); g.gain.exponentialRampToValueAtTime(0.3,t+n[1]+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]+0.5);
      o.connect(g); g.connect(a.destination); o.start(t+n[1]); o.stop(t+n[1]+0.55);
    });
  }catch(e){}
}
function listedParty(it, added){
  listedChime();
  if(navigator.vibrate) navigator.vibrate(60);
  showParty({title:'LISTED!', color:'#1e40af', tint:'rgba(30,64,175,.22)',
    line1:'📣 Now on '+plNames(added), line2:nameOf(it) + (it.ask!=null ? ' · asking '+money(num(it.ask)) : ''),
    emojis:['📣','⭐','📸','👀']});
}
$('party').onclick = function(){ this.classList.remove('show'); };

// ---------- Categories ----------
function openCats(){
  $('catEdit').innerHTML = cats.map(function(c,k){
    var n = items.filter(function(i){return i.cat===c.id && !isSold(i);}).length;
    return '<div class="catrow"><button class="mv" data-up="'+c.id+'" aria-label="Move up"'+(k===0?' disabled':'')+'>▲</button><button class="mv" data-down="'+c.id+'" aria-label="Move down"'+(k===cats.length-1?' disabled':'')+'>▼</button><span class="dot" style="background:'+catColor(c,k)+'"></span><input data-id="'+c.id+'" value="'+esc(c.name)+'"><span class="meta">'+n+'</span><button class="x" data-del="'+c.id+'">Delete</button></div>';
  }).join('');
  $('catBg').classList.add('open');
}
function moveCat(id,dir){
  var arr = cats.slice(), k = arr.findIndex(function(c){return c.id===id;}), j = k+dir;
  if(k<0||j<0||j>=arr.length) return;
  var t = arr[k]; arr[k]=arr[j]; arr[j]=t;
  var b = db.batch();
  arr.forEach(function(c,i){ b.update(CATS.doc(c.id),{order:i}); });
  cats = arr.map(function(c,i){ c.order=i; return c; });
  renderTabs(); render(); openCats();
  b.commit();
}
$('catEdit').onchange = function(e){
  var id = e.target.dataset.id, v = e.target.value.trim();
  if(id && v){ CATS.doc(id).update({name:v}); toast('Renamed'); }
};
$('catEdit').onclick = function(e){
  var bt = e.target.closest('button'); if(!bt) return;
  if(bt.dataset.up){ moveCat(bt.dataset.up,-1); return; }
  if(bt.dataset.down){ moveCat(bt.dataset.down,1); return; }
  var id = bt.dataset.del; if(!id) return;
  if(cats.length<2){ toast('Keep at least one category'); return; }
  var inIt = items.filter(function(i){return i.cat===id;});
  var other = cats.find(function(c){return c.id!==id;});
  var msg = inIt.length ? 'Delete “'+catName(id)+'”? Its '+inIt.length+' machine(s) will move to “'+other.name+'”.' : 'Delete “'+catName(id)+'”?';
  if(!confirm(msg)) return;
  var b = db.batch();
  inIt.forEach(function(i){ b.update(ITEMS.doc(i.id),{cat:other.id}); });
  b.delete(CATS.doc(id));
  b.commit().then(function(){ if(tab===id) tab='all'; setTimeout(openCats,50); toast('Deleted'); });
};
$('addCat').onclick = function(){
  var v = $('newCat').value.trim(); if(!v) return;
  CATS.add({name:v, order:cats.length}).then(function(){ $('newCat').value=''; setTimeout(openCats,50); toast('Category added'); });
};
$('catDone').onclick = function(){ $('catBg').classList.remove('open'); };
$('catBg').onclick = function(e){ if(e.target===this) this.classList.remove('open'); };
$('catBtn').onclick = openCats;

$('exportBtn').onclick = function(){
  var rows = [['Category','Brand','Model','Origin','Listed on','Purchase price','Parts expenditure','Asking price','Sale price','Profit','Date acquired','Date sold','Notes']];
  items.forEach(function(i){
    rows.push([catName(i.cat),i.brand,i.model,i.origin,(i.pl||[]).map(function(k){return PL[k]||k;}).join(' / '),i.buy,i.parts,i.ask,i.sale,isSold(i)?profitOf(i).toFixed(2):'',i.got,i.sold,i.notes]);
  });
  var csv = rows.map(function(r){ return r.map(function(v){ v = v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'bobshop-'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
};

// ---------- Tabs & search ----------
$('tabs').onclick = function(e){
  var t = e.target.closest('[data-t]'); if(!t) return;
  tab = t.dataset.t; renderTabs(); render();
};
$('q').oninput = render;
$('list').onclick = function(e){
  var b = e.target.closest('.item'); if(!b) return;
  if(e.target.classList.contains('th')) openGallery(b.dataset.id);
  else openItem(b.dataset.id);
};
</script>
